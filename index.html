<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GT Tri photo search</title><style>body{background:#101827;color:white;font:16px system-ui;margin:2rem auto;max-width:1300px;padding:0 1rem}input,select{font:inherit;padding:.65rem;border-radius:8px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px}article{background:#273449;padding:8px;border-radius:10px;overflow:hidden}img{width:100%;height:200px;object-fit:contain;background:#161f2d}small{color:#d1d5db}a{color:#98d7ff}</style><h1>GT Triathlon photo search</h1><p>Confirmed = exact 3 digits. Possible = 2 matching digits or a photo within three of a confirmed image.</p><input id="q" placeholder="Bib or athlete name"><select id="kind"><option value="all">All photos</option><option value="guaranteed">Guaranteed only</option><option value="possible">Possible only</option></select><p id="status">Loading...</p><div id="grid"></div><script>let photos=[],roster={},athletes={};let q=document.querySelector('#q'),k=document.querySelector('#kind'),grid=document.querySelector('#grid'),status=document.querySelector('#status');function render(){let term=q.value.trim().toLowerCase(), bib=Object.keys(roster).find(b=>b===term||roster[b].toLowerCase()===term);if(!bib&&term)bib=Object.keys(roster).find(b=>roster[b].toLowerCase().includes(term));let out=photos.filter(p=>{if(!term)return k.value==='all'||(k.value==='guaranteed'?p.bibs.length:p.possible.length);let b=bib||term;let g=p.bibs.some(x=>x.includes(b)),f=p.possible.some(x=>x.includes(b));if(bib){let a=athletes[bib];g=a.guaranteed.includes(p.name);f=a.possible.includes(p.name)}return k.value==='guaranteed'?g:k.value==='possible'?f:g||f});status.textContent=`${out.length} of ${photos.length} photos`;grid.replaceChildren();for(let p of out){let card=document.createElement('article'),im=document.createElement('img');im.src=p.thumb;im.loading='lazy';im.alt=p.name;let label=document.createElement('p');label.textContent=p.name;let b=document.createElement('small');b.textContent='Confirmed: '+(p.bibs.join(', ')||'none')+' | OCR possible: '+(p.possible.join(', ')||'none');card.append(im,label,b);grid.append(card)}}Promise.all([fetch('photos.json').then(r=>r.json()),fetch('roster.json').then(r=>r.json()),fetch('athlete_index.json').then(r=>r.ok?r.json():{})]).then(([p,r,a])=>{photos=p;roster=r;athletes=a;render()}).catch(e=>status.textContent='Could not load data: '+e);q.oninput=render;k.onchange=render;</script>
